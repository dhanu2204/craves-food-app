<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errDiv = document.createElement('div');
        errDiv.style = "position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-family:monospace;width:100%;box-sizing:border-box;";
        errDiv.innerHTML = "<h3>Error:</h3>" + message + "<br/>" + source + ":" + lineno + ":" + colno + "<br/><pre>" + (error && error.stack ? error.stack : '') + "</pre>";
        document.body.prepend(errDiv);
      };
      window.addEventListener("unhandledrejection", function(e) {
        var errDiv = document.createElement('div');
        errDiv.style = "position:fixed;top:0;left:0;z-index:9999;background:orange;color:white;padding:20px;font-family:monospace;width:100%;box-sizing:border-box;";
        errDiv.innerHTML = "<h3>Unhandled Promise Rejection:</h3>" + e.reason;
        document.body.prepend(errDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
